<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nebula Knight</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    #p5canvas {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    
    #p5canvas canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      border-radius: 2px;
      cursor: pointer;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      #p5canvas canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, #p5canvas canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Nebula</span> Knight</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <div id="p5canvas">
      <img id="shirt-mockup" src="Nebula-Knight.jpg" alt="Nebula Knight on T-Shirt" />
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">grid</span>
        <span class="value" id="gridDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">steps</span>
        <span class="value" id="stepsDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">knight's tour</span>
      <span class="sep">·</span>
      <span class="highlight">5–105 grid</span>
      <span class="sep">·</span>
      <span class="highlight">random circles</span>
      <span class="sep">·</span>
      <span class="highlight">gradient colors</span>
    </div>

  </div>

</div>

<script>
// ============================================
// NEBULA KNIGHT — P5.JS (EXACT ORIGINAL ART)
// ============================================

const e = Math.min(window.innerWidth, window.innerHeight);
const canvas = {
  w: e,
  h: e
};

let cols;
let rows;
let rectWidth, rectHeight;
let knightPath = [];
let totalSteps;
let s1, s2;
const scaleFactor = 9 / 10;
let colormode;
let startColor;
let endColor;
let showingShirt = false;

const container = document.getElementById('p5canvas');

const sketch = function(p) {
  p.setup = function() {
    const rect = container.getBoundingClientRect();
    let cWidth = rect.width;
    let cHeight = rect.height;
    const size = Math.min(cWidth, cHeight);
    
    const canvasEl = p.createCanvas(size, size);
    canvasEl.parent(container);
    p.colorMode(p.HSB, 360, 255, 255);
    p.noLoop();

    cols = Math.floor(p.random() * 100) + 5;
    rows = Math.floor(p.random() * 100) + 5;

    s1 = Math.floor(p.random() * Math.min(cols, rows) / (p.random() * 5 + 1)) + 1;
    s2 = Math.floor(p.random() * Math.min(cols, rows) / (p.random() * 5 + 1)) + 1;

    rectWidth = (size * scaleFactor) / cols;
    rectHeight = (size * scaleFactor) / rows;

    totalSteps = Math.floor(p.random() * 1000) + 10;

    let startX = Math.floor(p.random() * cols) + 1;
    let startY = Math.floor(p.random() * rows) + 1;
    knightPath.push({ x: startX, y: startY });

    colormode = Math.floor(p.random() * 5);

    for (let i = 0; i < totalSteps; i++) {
      let nextMove = getRandomKnightMove(knightPath[knightPath.length - 1], s1, s2);
      if (nextMove) {
        knightPath.push(nextMove);
      } else {
        break;
      }
    }

    document.getElementById('gridDisplay').textContent = cols + '×' + rows;
    document.getElementById('stepsDisplay').textContent = knightPath.length;
  };

  p.draw = function() {
    const size = Math.min(p.width, p.height);
    p.background(255);

    let offsetX = (size - size * scaleFactor) / 2;
    let offsetY = (size - size * scaleFactor) / 2;

    if (colormode === 0) {
      startColor = p.color(0, 0, 0);
      endColor = p.color(255, 255, 255);
    } else if (colormode === 1) {
      startColor = p.color(0, 0, 255);
      endColor = p.color(255, 255, 255);
    } else if (colormode === 2) {
      startColor = p.color(0, 255, 255);
      endColor = p.color(255, 255, 255);
    } else if (colormode === 3) {
      startColor = p.color(255, 0, 255);
      endColor = p.color(255, 255, 255);
    } else if (colormode === 4) {
      startColor = p.color(255, 255, 0);
      endColor = p.color(255, 255, 255);
    }

    for (let i = 0; i < knightPath.length; i++) {
      let pos = knightPath[i];

      let px = offsetX + (pos.x - 1) * rectWidth + rectWidth / 2;
      let py = offsetY + (pos.y - 1) * rectHeight + rectHeight / 2;

      let interColor = p.lerpColor(startColor, endColor, i / knightPath.length);
      p.noFill();
      p.stroke(interColor);
      p.strokeWeight(2);

      let minRadius = Math.min(s1, s2);
      let maxRadius = size / 10;
      let radius = minRadius + (p.random() * (maxRadius - minRadius));

      p.ellipse(px, py, radius, radius);
    }
  };

  function getRandomKnightMove(position, Step1, Step2) {
    let { x, y } = position;
    let moves = [
      { x: x + Step1, y: y + Step2 }, { x: x + Step1, y: y - Step2 },
      { x: x - Step1, y: y + Step2 }, { x: x - Step1, y: y - Step2 },
      { x: x + Step2, y: y + Step1 }, { x: x + Step2, y: y - Step1 },
      { x: x - Step2, y: y + Step1 }, { x: x - Step2, y: y - Step1 }
    ];

    let validMoves = moves.filter(m => m.x >= 1 && m.x <= cols && m.y >= 1 && m.y <= rows);
    return validMoves.length > 0 ? validMoves[Math.floor(p.random() * validMoves.length)] : null;
  }

  // Click to regenerate
  p.mousePressed = function() {
    if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
      regenerate();
    }
  };
};

// --- REGENERATE ---
function regenerate() {
  const p5canvas = document.querySelector('#p5canvas canvas');
  if (p5canvas) {
    p5canvas.remove();
  }
  knightPath = [];
  new p5(sketch);
  if (showingShirt) {
    // If in shirt mode, keep showing shirt after regenerate
    const canvas = document.querySelector('#p5canvas canvas');
    if (canvas) canvas.style.display = 'none';
  }
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const p5canvas = document.getElementById('p5canvas');
  const canvas = p5canvas.querySelector('canvas');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    if (canvas) canvas.style.display = 'none';
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    if (canvas) canvas.style.display = 'block';
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- SAVE ---
function saveImage() {
  const canvas = document.querySelector('#p5canvas canvas');
  if (showingShirt) {
    // Save shirt mockup
    const link = document.createElement('a');
    link.download = 'Nebula_Knight_Shirt.png';
    link.href = document.getElementById('shirt-mockup').src;
    link.click();
  } else if (canvas) {
    const link = document.createElement('a');
    link.download = 'Nebula_Knight.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    saveImage();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- RESIZE ---
let resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    regenerate();
  }, 300);
});

// --- INIT ---
function init() {
  new p5(sketch);
  console.log('Nebula Knight — p5.js T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
  console.log('Press S to save');
  console.log('Press R to regenerate');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.regenerate = regenerate;
window.saveImage = saveImage;
window.toggleShirt = toggleShirt;
</script>
</body>
</html>
